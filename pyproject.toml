[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ball-flight-simulator"
version = "0.1.0"
description = "Reusable baseball flight simulation with optional scene visualization helpers."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
scene = [
    "plotly",
    "scipy",
]
pyvista = [
    "pyvista",
]
test = []

[tool.setuptools.packages.find]
where = ["src"]
