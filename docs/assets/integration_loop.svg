<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
  <title id="title">Semi-implicit Euler integration loop</title>
  <desc id="desc">Flow chart showing the simulator update sequence: current state, forces, acceleration, next velocity, next position, ground check, store or interpolate impact.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="860" height="500" fill="#ffffff"/>
  <style>
    .box { fill:#f8fafc; stroke:#111827; stroke-width:2; rx:8; }
    .decision { fill:#fff7ed; stroke:#c2410c; stroke-width:2; }
    .text { font-family:Arial, sans-serif; font-size:17px; fill:#111827; }
    .small { font-family:Arial, sans-serif; font-size:15px; fill:#4b5563; }
    .arrow { stroke:#374151; stroke-width:3; fill:none; marker-end:url(#arrow); }
  </style>
  <text x="45" y="42" class="text" font-weight="700" font-size="24">One time step in `calculate_path()`</text>
  <rect x="55" y="75" width="210" height="72" class="box"/>
  <text x="76" y="105" class="text">Current state</text>
  <text x="76" y="130" class="small">position, velocity, time</text>
  <path d="M265 111 H338" class="arrow"/>
  <rect x="340" y="75" width="225" height="72" class="box"/>
  <text x="362" y="101" class="text">Compute forces</text>
  <text x="362" y="126" class="small">drag, lift, gravity</text>
  <path d="M565 111 H638" class="arrow"/>
  <rect x="640" y="75" width="175" height="72" class="box"/>
  <text x="666" y="101" class="text">Acceleration</text>
  <text x="666" y="126" class="small">a = F / m</text>
  <path d="M728 147 V205" class="arrow"/>
  <rect x="620" y="207" width="215" height="74" class="box"/>
  <text x="642" y="235" class="text">Update velocity</text>
  <text x="642" y="260" class="small">v_next = v + a dt</text>
  <path d="M620 244 H548" class="arrow"/>
  <rect x="315" y="207" width="230" height="74" class="box"/>
  <text x="337" y="235" class="text">Update position</text>
  <text x="337" y="260" class="small">x_next = x + v_next dt</text>
  <path d="M315 244 H243" class="arrow"/>
  <polygon points="122,198 238,244 122,290 6,244" class="decision"/>
  <text x="61" y="239" class="text">y_next <= 0?</text>
  <path d="M122 290 V365" class="arrow"/>
  <rect x="40" y="367" width="250" height="74" class="box"/>
  <text x="62" y="395" class="text">Interpolate impact</text>
  <text x="62" y="420" class="small">final sample has y = 0</text>
  <path d="M238 244 H315" class="arrow"/>
  <text x="252" y="231" class="small">no</text>
  <path d="M290 404 H495" class="arrow"/>
  <rect x="497" y="367" width="255" height="74" class="box"/>
  <text x="519" y="395" class="text">Store state arrays</text>
  <text x="519" y="420" class="small">time-aligned trajectory output</text>
  <path d="M430 281 V367" class="arrow"/>
  <text x="140" y="326" class="small">yes</text>
</svg>
