<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Forces on a pitched baseball</title>
  <desc id="desc">A baseball with velocity forward, drag opposite velocity, gravity downward, and Magnus lift perpendicular to spin and velocity.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#ffffff"/>
  <circle cx="370" cy="230" r="46" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
  <path d="M340 210 C365 195, 392 195, 414 210" fill="none" stroke="#ef4444" stroke-width="3"/>
  <path d="M333 246 C362 260, 392 260, 421 246" fill="none" stroke="#ef4444" stroke-width="3"/>
  <text x="338" y="237" fill="#111827" font-family="Arial, sans-serif" font-size="18">ball</text>
  <line x1="370" y1="230" x2="575" y2="170" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="575" y="162" fill="#2563eb" font-family="Arial, sans-serif" font-size="20" font-weight="700">velocity v</text>
  <line x1="370" y1="230" x2="195" y2="282" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="105" y="306" fill="#dc2626" font-family="Arial, sans-serif" font-size="20" font-weight="700">drag F_d</text>
  <line x1="370" y1="230" x2="370" y2="395" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="382" y="390" fill="#16a34a" font-family="Arial, sans-serif" font-size="20" font-weight="700">gravity mg</text>
  <line x1="370" y1="230" x2="455" y2="70" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="462" y="76" fill="#7c3aed" font-family="Arial, sans-serif" font-size="20" font-weight="700">Magnus lift F_l</text>
  <text x="80" y="68" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Net force</text>
  <text x="80" y="100" fill="#111827" font-family="Arial, sans-serif" font-size="20">F = F_drag + F_lift + F_gravity</text>
  <text x="80" y="130" fill="#4b5563" font-family="Arial, sans-serif" font-size="18">Acceleration follows Newton's second law: a = F / m</text>
</svg>
