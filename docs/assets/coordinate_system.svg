<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Ball flight coordinate system</title>
  <desc id="desc">A baseball release point with X right, Y up, and Z forward toward home plate.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <line x1="60" y1="340" x2="700" y2="340" stroke="#d1d5db" stroke-width="2"/>
  <text x="64" y="365" fill="#4b5563" font-family="Arial, sans-serif" font-size="18">ground plane: y = 0</text>
  <circle cx="185" cy="300" r="16" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
  <text x="130" y="278" fill="#111827" font-family="Arial, sans-serif" font-size="18">release point</text>
  <polygon points="625,318 665,318 681,330 665,342 625,342" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
  <text x="594" y="304" fill="#111827" font-family="Arial, sans-serif" font-size="18">home plate</text>
  <line x1="185" y1="300" x2="185" y2="110" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="198" y="122" fill="#16a34a" font-family="Arial, sans-serif" font-size="22" font-weight="700">+Y up</text>
  <line x1="185" y1="300" x2="350" y2="300" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="294" y="285" fill="#dc2626" font-family="Arial, sans-serif" font-size="22" font-weight="700">+X right</text>
  <line x1="185" y1="300" x2="560" y2="175" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="460" y="170" fill="#2563eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">+Z forward</text>
  <path d="M185 300 C280 244, 385 202, 560 175" fill="none" stroke="#4b5563" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow-gray)"/>
  <text x="305" y="224" fill="#4b5563" font-family="Arial, sans-serif" font-size="18">typical trajectory direction</text>
</svg>
